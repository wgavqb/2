name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psutil pytest
      - run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin
          --name FPSBooster --add-data "fps_booster/ui;fps_booster/ui" run.py
      - name: Smoke test (CLI)
        run: python -m fps_booster --list --no-admin
      - uses: actions/upload-artifact@v4
        with:
          name: FPSBooster
          path: dist/FPSBooster.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FPSBooster.exe
