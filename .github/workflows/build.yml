name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psutil pytest
      - run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin
          --name FPSBooster --add-data "fps_booster/ui;fps_booster/ui" run.py
      - name: Smoke test (CLI)
        run: python -m fps_booster --list --no-admin
      - uses: actions/upload-artifact@v4
        with:
          name: FPSBooster
          path: dist/FPSBooster.exe
      - name: Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # тег релиза создаётся на GitHub автоматически для каждой сборки
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: FPS Booster ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('(сборка {0})', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Скачайте **FPSBooster.exe**, запустите и подтвердите запрос прав администратора.
            Windows 10/11. Всё откатывается кнопкой «Откатить всё».
          files: dist/FPSBooster.exe
