name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psutil pytest numpy scipy
      - run: python -m pytest -q

  windows-exe:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: PyInstaller со своим загрузчиком (собирается из исходников — меньше ложных срабатываний антивирусов)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-binary pyinstaller pyinstaller==6.22.3
      - name: Проверка, что загрузчик собран у нас
        run: python buildtools/check_bootloader.py
      - run: python -m pytest -q
      - name: Build exe
        run: python buildtools/build.py
      - name: Smoke test (CLI)
        run: |
          python -m fps_booster --list --no-admin
          python -c "from fps_booster.gpu import _dxgi_adapters, list_gpus; print(_dxgi_adapters()); print(list_gpus())"
          python -c "from mic_booster.api import Api; print(Api().get_state()['devices'])"
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: |
            dist/FPSBooster.exe
            dist/MicPro.exe
            dist/SHA256SUMS.txt
      - name: Release
        # релизы — только из основной ветки проекта, тегов v* и ручного запуска
        if: >
          github.event_name == 'workflow_dispatch' || (github.event_name == 'push' &&
          (github.ref == 'refs/heads/claude/game-fps-booster-app-remt3l' || startsWith(github.ref, 'refs/tags/v')))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: FPS Booster + MicPro ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('(сборка {0})', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/FPSBooster.exe
            dist/MicPro.exe
            dist/SHA256SUMS.txt
