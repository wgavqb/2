<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ContaSimple Sync</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#0f1117;color:#e2e8f0;
  width:300px;padding:0;overflow:hidden;
}
.header{
  background:linear-gradient(135deg,#6366f1,#a855f7);
  padding:18px 20px 16px;
  display:flex;align-items:center;gap:12px;
}
.logo{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.header-text h1{font-size:15px;font-weight:700;color:#fff}
.header-text p{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}

.body{padding:16px}

.status-card{
  background:#161b27;border:1px solid #1e2d3d;border-radius:10px;
  padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;
}
.dot{width:10px;height:10px;border-radius:50%;background:#475569;flex-shrink:0}
.dot.ok{background:#22c55e;box-shadow:0 0 8px #22c55e80}
.dot.err{background:#ef4444;box-shadow:0 0 8px #ef444480}
.dot.loading{background:#f59e0b;animation:pulse .8s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{font-size:13px;font-weight:500}
.status-sub{font-size:11px;color:#64748b;margin-top:2px}

.btn{
  width:100%;padding:11px;border-radius:8px;border:none;
  font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:.15s;font-family:inherit;margin-bottom:8px;
}
.btn-primary{background:#6366f1;color:#fff}
.btn-primary:hover:not(:disabled){background:#818cf8}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:#1e2536;color:#94a3b8;border:1px solid #1e2d3d}
.btn-ghost:hover{background:#252d42;color:#e2e8f0}

.divider{border:none;border-top:1px solid #1e2d3d;margin:12px 0}

.info{font-size:11px;color:#475569;line-height:1.6;padding:10px 14px;
  background:#161b27;border-radius:8px;border:1px solid #1e2d3d}
.info strong{color:#94a3b8}
.info code{background:#252d42;padding:1px 5px;border-radius:4px;font-family:monospace;font-size:10px}

.cookie-count{
  display:inline-flex;align-items:center;gap:5px;
  background:#6366f120;color:#818cf8;font-size:11px;font-weight:600;
  padding:3px 10px;border-radius:20px;margin-top:8px;
}

.auto-badge{
  display:flex;align-items:center;gap:6px;font-size:11px;color:#22c55e;
  background:#22c55e15;border:1px solid #22c55e30;border-radius:6px;
  padding:6px 10px;margin-top:8px;
}

.link{color:#818cf8;text-decoration:none;font-size:11px}
.link:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="header">
  <div class="logo">📊</div>
  <div class="header-text">
    <h1>ContaSimple Sync</h1>
    <p>Sincronización automática de cookies</p>
  </div>
</div>

<div class="body">

  <!-- Estado del dashboard -->
  <div class="status-card">
    <div class="dot loading" id="dash-dot"></div>
    <div>
      <div class="status-text" id="dash-text">Comprobando dashboard...</div>
      <div class="status-sub" id="dash-sub">http://127.0.0.1:5050</div>
    </div>
  </div>

  <!-- Botón principal -->
  <button class="btn btn-primary" id="btn-sync" onclick="syncNow()">
    🔄 Sincronizar Cookies Ahora
  </button>
  <button class="btn btn-ghost" onclick="openDashboard()">
    🚀 Abrir Dashboard
  </button>

  <div id="result-area"></div>

  <hr class="divider">

  <!-- Info -->
  <div class="info">
    <strong>Sincronización automática activa</strong><br>
    El fondo envía las cookies cada vez que cambian en
    <code>app.contasimple.com</code>.<br>
    Simplemente inicia sesión en ContaSimple y el dashboard se conecta solo.
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
